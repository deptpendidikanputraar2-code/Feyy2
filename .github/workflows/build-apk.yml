name: Build & Release MMQA AR2 APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag versi release (contoh: v1.0.0). Kosongkan untuk otomatis."
        required: false
        default: ""
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Prepare .env from GitHub Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env
            echo "File .env dibuat dari GitHub Secrets."
          else
            echo "::warning::GitHub Secrets SUPABASE_URL / SUPABASE_ANON_KEY belum diisi. Sinkronisasi Supabase mungkin tidak aktif."
            cp .env.example .env
          fi

      - name: Prepare Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f "app/google-services.json" ]; then
            echo "Menggunakan app/google-services.json yang sudah ada di repository."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "app/google-services.json dibuat dari secret GOOGLE_SERVICES_JSON."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "app/google-services.json dibuat dari secret GOOGLE_SERVICES_JSON_BASE64."
          else
            echo "::warning::app/google-services.json tidak ditemukan. Tambahkan secret GOOGLE_SERVICES_JSON di GitHub agar Google Sign-In & Firebase aktif di APK."
          fi

      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "build_type=release" >> "$GITHUB_OUTPUT"
            echo "Menggunakan release keystore dari GitHub Secrets."
          else
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            elif [ -f "debug.keystore.base64" ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=MMQA AR2,O=MMQA Al Rifai 02,C=ID"
            fi
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
            echo "Menggunakan debug.keystore (set KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD untuk release signed)."
          fi

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.build_type }}" = "release" ]; then
            gradle :app:assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk MMQA-AR2-release.apk
            echo "APK_FILE=MMQA-AR2-release.apk" >> "$GITHUB_ENV"
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk MMQA-AR2.apk
            echo "APK_FILE=MMQA-AR2.apk" >> "$GITHUB_ENV"
          fi

      - name: Print APK Certificate SHA-1 (for Firebase)
        run: |
          CERT_INFO=$(keytool -printcert -jarfile "${{ env.APK_FILE }}")
          SHA1=$(echo "$CERT_INFO" | grep -m1 "SHA1:" | awk '{print $2}')
          SHA256=$(echo "$CERT_INFO" | grep -m1 "SHA256:" | awk '{print $2}')
          echo "APK_SHA1=$SHA1" >> "$GITHUB_ENV"
          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"
          {
            echo "### Sidik Jari Sertifikat APK (untuk Firebase Google Sign-In)"
            echo "- **SHA-1:** \`$SHA1\`"
            echo "- **SHA-256:** \`$SHA256\`"
            echo ""
            echo "Daftarkan **SHA-1** di atas ke Firebase Console -> Project settings -> Your apps -> Add fingerprint agar Sign in with Google aktif."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMQA-AR2-APK
          path: ${{ env.APK_FILE }}

      - name: Determine Release Tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "MMQA AR2 ${{ steps.tag.outputs.tag_name }}"
          body: |
            Build otomatis APK **MMQA Al Rifai 02 (AR2)**.
            Unduh file `.apk` di bagian **Assets** di bawah untuk dipasang di perangkat Android.

            **Sidik Jari Sertifikat APK (untuk Firebase → Add fingerprint):**
            - SHA-1: `${{ env.APK_SHA1 }}`
            - SHA-256: `${{ env.APK_SHA256 }}`
          files: ${{ env.APK_FILE }}
          make_latest: true
